<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/public/styles/styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banderas</title>
</head>
<body>
    <!-- Botón volver (solo visible si no se está jugando) -->
    <a href="../offline-mode.html" class="btn-volver">
        <img src="/public/images/boton-salir.webp" alt="volver">
    </a>

        

    <!-- Contenedor del Juego (inicialmente oculto) -->
    <div id="juego-container" style="display: none;">
        <div class="header-juego">
            <div id="timer" class="timer-display">15</div>
        </div>

        <div class="menu-container centered">
            <div class="bandera-container">
                <img id="bandera-imagen" src="" alt="Bandera">
            </div>
            <hr class="menu-divider-juego" />
            
            <div id="opciones-container" class="menu-options-juego">
                <!-- Opciones generadas por JS -->
            </div>
        </div>
    </div>

    <script type="module" src="/backend/functions/game/banderas.js"></script>
</body>
</html>
