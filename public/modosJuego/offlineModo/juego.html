<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/public/styles/styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego - Preguntados</title>
</head>
<body>
    <div class="game-container">
        <div id="pregunta-container">
            <div id="timer-container">Tiempo: <span id="timer">15</span>s</div>
            <img id="pregunta-imagen" src="" alt="Pregunta" style="display: none; max-width: 100%; height: auto; margin-bottom: 20px;">
            <h2 id="pregunta-enunciado"></h2>
            <div id="opciones-container">
                <!-- Las opciones de respuesta se generarán aquí -->
            </div>
        </div>
        <div id="resultado-container" style="display: none;">
            <h2>¡Respuesta Correcta!</h2>
            <p>+10 Puntos</p>
        </div>
    </div>
    <script type="module" src="/backend/functions/game/juego.js"></script>
</body>
</html>
