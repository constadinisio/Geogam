<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./styles/styles.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marzzatino</title>
  </head>

  <body>

    <div id="main-content">
      <!-- Botones de Configuración y Perfil-->
      <div class="botones">
        <!-- Botón configuración -->
        <a href="./subpages/configuracion.html" class="btn config">
          <img
            src="./images/engranaje-madera.png"
            alt="Configuración"
            class="icon"
          />
        </a>

        <!-- Botón perfil -->
        <a href="/public/subpages/perfil.html" class="btn perfil">
          <img
            src="./images/user.png"
            alt="Perfil"
            class="icon invertida"
            style="width: 100%; height: 50%"
          />
        </a>
      </div>

      <!-- Columnas -->
      <div class="menu">
        <div class="menu-header">MODOS DE JUEGO</div>

        <hr class="menu-divider" />

        <div class="menu-body">
          <img
            src="./images/menu_select.png"
            alt="Decoración"
            class="menu-img"
          />

          <div class="menu-options">
            <button class="menu-btn">ONLINE</button>
            <button class="menu-btn">OFFLINE</button>
          </div>
        </div>
      </div>

      <div class="navbar">
        <a href="./subpages/tienda.html" class="nav-item">
          <img src="./images/cofre.png" alt="Tienda" />
          <span class="nav-text">TIENDA</span>
        </a>

        <a href="./subpages/menu.html" class="nav-item active">
          <img src="images/boton-castle.png" alt="Menu" />
          <span class="nav-text">MENU</span>
        </a>

        <a href="./subpages/misiones.html" class="nav-item">
          <img src="./images/boton-mision.png" alt="Misiones" />
          <span class="nav-text">MISIONES</span>
        </a>

        <a href="./subpages/estadisticas.html" class="nav-item">
          <img src="./images/estadisticas.png" alt="Estadísticas" />
          <span class="nav-text">ESTADISTICAS</span>
        </a>
      </div>
    </div>

    <!-- Pantalla de Carga (Visible al iniciar la página) -->
    <div id="pantalla_de_carga">
      <img src="images/logo_redondeado.png" alt="logo" class="logo" />
      <hr />

      <img src="images/reloj_arena.gif" alt="Cargando..." class="carga" />
      <p id="copyright">©Marzzatino</p>
    </div>

    <audio id="background-music" loop>
      <source src="./audio/background_music.wav" type="audio/wav"> <!-- TYPE CAMBIADO -->
      <!-- Puedes agregar otras fuentes para compatibilidad con navegadores -->
      <!-- <source src="./audio/background_music.ogg" type="audio/ogg"> -->
      Tu navegador no soporta el elemento de audio.
    </audio>

    <script type="module" src="../backend/config/firebase-config.js"></script>
    <script type="module" src="../backend/scripts/auth/auth.js"></script>

    <!-- Enlaza musicPlayer.js como módulo (SOLO UNA VEZ) -->
    <script type="module" src="../backend/scripts/misc/musicPlayer.js"></script>

    <!-- Script para iniciar la música y aplicar volumen guardado -->
    <script type="module">
      import { playMusic, setVolume } from '../backend/scripts/misc/musicPlayer.js'; // Importa setVolume
      import { checkAuthState, logout } from '../backend/scripts/auth/auth.js';

      // Verificar estado de autenticación al cargar la página
      checkAuthState();

      // Adjuntar la función logout a un botón si está en esta página
      const logoutButton = document.getElementById('logoutButton');
      if (logoutButton) {
        logoutButton.addEventListener('click', logout);
      }

      // Iniciar la música y aplicar volumen guardado cuando el DOM esté completamente cargado
      document.addEventListener('DOMContentLoaded', () => {
        // Leer el volumen guardado de localStorage
        const savedVolume = localStorage.getItem('musicVolume');

        if (savedVolume !== null) {
          // Si hay un volumen guardado, aplícalo a la música
          setVolume(parseFloat(savedVolume));
          console.log("Volumen de música cargado desde localStorage:", savedVolume);
        } else {
          // Si no hay volumen guardado, puedes establecer un volumen por defecto (opcional)
           setVolume(0.5); // Por ejemplo, un volumen por defecto de 0.5
           console.log("No hay volumen guardado, estableciendo volumen por defecto (0.5).");
        }

        playMusic(); // Iniciar la reproducción de la música
      });
    </script>

    <script src="../backend/scripts/misc/pantallaCarga.js"></script>
  </body>
</html>
