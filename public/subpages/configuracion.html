<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles/styles.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marzzatino</title>
</head>

<body>

  <!-- Botones de Configuración y Perfil-->


  <!-- Botón volver -->

  <a href="../menu.html" class="btn-volver">
    <img src="../images/boton-salir.png" alt="volver">
  </a>

  <!-- config -->

  <div class="body-pergamino">
    <div class="pergamino-header">CONFIGURACION</div>

    <hr class="hr-body">

    <div class="sonido">
      <div class="label-box">
        <p class="p1">Sonido UX/UI</p>
      </div>

      <!-- CAMBIAR EL ID DEL AUDIO Y CORREGIR EL TYPE DE LA FUENTE -->
      <audio id="background-music" loop hidden>
        <source src="../audio/background_music.wav" type="audio/wav"> <!-- CAMBIADO -->
        <!-- Si también tienes un mp3 para compatibilidad: -->
        <!-- <source src="../audio/background_music.mp3" type="audio/mpeg"> -->
      </audio>

      <div class="volume-container">
        <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5"> <!-- ID CAMBIADO -->
      </div>
    </div>

    <div class="sonido">
      <div class="label-box">
        <p class="p2">Efectos de sonido</p>
      </div>

      <!-- Efecto de prueba -->
      <audio id="click-sound" src="../audio/click-4.mp3" preload="auto"></audio>

      <div class="volume-container">
        <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5">
      </div>
    </div>

    <button class="click-sound">boton probar</button>

    <!-- Enlaza musicPlayer.js como módulo -->
    <script type="module" src="../../backend/scripts/misc/musicPlayer.js"></script>

    <!-- Script para controlar el volumen E iniciar la música -->
    <script type="module">
      import { setVolume, playMusic } from '../../backend/scripts/misc/musicPlayer.js';

      // 🎵 Música de fondo (igual que antes)
      const volumeSlider = document.getElementById('volume');
      document.addEventListener('DOMContentLoaded', () => {
        playMusic();
      });

      if (volumeSlider) {
        const savedVolume = localStorage.getItem('musicVolume');
        if (savedVolume !== null) {
          volumeSlider.value = savedVolume;
          setVolume(parseFloat(savedVolume));
        } else {
          setVolume(parseFloat(volumeSlider.value));
        }

        volumeSlider.addEventListener('input', (event) => {
          const volume = parseFloat(event.target.value);
          setVolume(volume);
          localStorage.setItem('musicVolume', volume);
        });
      }
    </script>
    
    <script type="module">
      import { setEffectsVolume, playClickSound, wireClickSound } from "../../backend/scripts/misc/soundEffects.js";
    
      wireClickSound();
    
      const effectsSlider = document.getElementById("effects-volume");
      if (effectsSlider) {
        const saved = localStorage.getItem("effectsVolume");
        if (saved !== null) effectsSlider.value = saved;
        setEffectsVolume(effectsSlider.value);
    
        effectsSlider.addEventListener("input", (e) => {
          setEffectsVolume(e.target.value);
          playClickSound(); // preview
        });
      }
    </script>

  </div>

  <!-- barra de navegación -->
  <div class="navbar">
    <a href="../tienda.html" class="nav-item">
      <img src="../images/cofre.png" alt="Tienda">
      <span class="nav-text">TIENDA</span>
    </a>

    <a href="../menu.html" class="nav-item">
      <img src="../images/boton-castle.png" alt="Menu">
      <span class="nav-text">MENU</span>
    </a>

    <a href="../misiones.html" class="nav-item">
      <img src="../images/boton-mision.png" alt="Misiones">
      <span class="nav-text">MISIONES</span>
    </a>

    <a href="../estadisticas.html" class="nav-item">
      <img src="../images/estadisticas.png" alt="Estadísticas">
      <span class="nav-text">ESTADISTICAS</span>
    </a>
  </div>

  <script type="module" src="../../backend/config/firebase-config.js"></script>
  <script type="module" src="../../backend/scripts/auth/auth.js"></script>
  <script type="module">
    import { checkAuthState, logout } from '../../backend/scripts/auth/auth.js';

    // Verificar estado de autenticación al cargar la página
    checkAuthState();
  </script>
</body>

</html>
